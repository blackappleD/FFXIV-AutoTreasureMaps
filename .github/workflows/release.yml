name: Release TreasureHelper

# Fork (blackappleD): a v*.*.*.* tag builds the plugin against the CN Dalamud
# (ottercorp) and publishes TreasureHelper.zip on a GitHub Release marked
# latest. repo.json links to that release by its tag (releases/download/vX/), not to
# releases/latest: a client holding a cached repo.json would otherwise download a
# newer zip than the version it expects, Dalamud refuses the install after it has
# already unloaded the plugin, and the game can crash. A release bumps the version
# and the three links in repo.json together.
#
# The tag can be pushed by hand (git push origin vX, which triggers this
# directly) or created by auto-tag.yml after a version bump reaches master,
# which dispatches this workflow, since a tag pushed with GITHUB_TOKEN does not
# trigger workflows. An annotated tag's message becomes the release notes;
# auto-tag's default "Release vX" falls back to GitHub's generated notes.

on:
  push:
    tags:
      - 'v*.*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0.2020). Defaults to the ref this is dispatched on.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'blackappleD/FFXIV-AutoTreasureMaps'
    runs-on: windows-latest

    steps:
      - name: Resolve target tag
        id: tag
        shell: bash
        run: |
          target="${{ inputs.tag }}"
          if [ -z "$target" ]; then
            target="${{ github.ref_name }}"
          fi
          if [[ ! "$target" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Resolved target '$target' is not a four-part v*.*.*.* tag; pass the tag input or dispatch on a tag ref."
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "version=${target#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $target"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.target }}
          submodules: recursive
          fetch-depth: 0

      - name: Check the tag matches the version
        shell: bash
        run: |
          version="${{ steps.tag.outputs.version }}"
          build_ver=$(grep -oP '<Version>\K[\d.]+(?=</Version>)' Directory.Build.props)
          repo_ver=$(jq -r '.[0].AssemblyVersion' repo.json)
          if [ "$build_ver" != "$version" ] || [ "$repo_ver" != "$version" ]; then
            echo "::error::Tag $version does not match Directory.Build.props ($build_ver) and repo.json ($repo_ver) at that commit."
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The CN client runs ottercorp's Dalamud, so the release is built against it.
      - name: Download CN Dalamud
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/ottercorp/dalamud-distrib/main/latest.7z' -OutFile dalamud.7z
          7z x dalamud.7z "-o$dalamudDir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Extracting the CN Dalamud failed" }
          Remove-Item dalamud.7z
          if (-not (Test-Path "$dalamudDir\Dalamud.dll")) { throw "Dalamud.dll not found in $dalamudDir" }

      - name: Build (Release)
        run: dotnet build AutoTreasureMaps.sln --configuration Release

      - name: Stage TreasureHelper.zip
        shell: pwsh
        run: |
          $src = 'AutoTreasureMaps/bin/Release/TreasureHelper/latest.zip'
          if (-not (Test-Path $src)) { throw "SDK-built plugin zip not found at $src" }
          Copy-Item $src 'TreasureHelper.zip' -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'TreasureHelper.zip'))
          try {
            $entry = $zip.GetEntry('TreasureHelper.json')
            if ($null -eq $entry) { throw 'TreasureHelper.json missing from the zip' }
            $reader = [System.IO.StreamReader]::new($entry.Open())
            $manifest = $reader.ReadToEnd() | ConvertFrom-Json
            $reader.Dispose()
          } finally {
            $zip.Dispose()
          }
          if ($manifest.AssemblyVersion -ne '${{ steps.tag.outputs.version }}') {
            throw "The zip's manifest says $($manifest.AssemblyVersion), not ${{ steps.tag.outputs.version }}"
          }

      - name: Read release notes from the tag
        id: notes
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.target }}"
          body=$(git tag -l --format='%(contents)' "$tag" | sed '/-----BEGIN PGP SIGNATURE-----/,$d')
          if [ -z "${body//[[:space:]]/}" ] || [ "$(echo "$body" | head -n1)" = "Release $tag" ]; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
            : > notes.md
          else
            echo "generate=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$body" > notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.target }}
          name: ${{ steps.tag.outputs.target }}
          files: TreasureHelper.zip
          body_path: notes.md
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          make_latest: true
          fail_on_unmatched_files: true
